name: Merchant Android APK
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/merchant-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Sync Android
        working-directory: mobile
        run: npm run sync
      - name: Build internal APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: huachuangsan-merchant-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
